[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OhnomiTools"
version = "0.1.0"
description = "High-performance Python toolkit for evolutionary and network motif analysis of WGD-derived long non-coding RNAs (Ohno-lncRNAs)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Giuseppe" }
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "numba>=0.59.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "pyvis>=0.3.2",
]

[project.urls]
Repository = "https://github.com/ErrPeppe/OhnomiTools"

[tool.setuptools.packages.find]
where = ["."]
include = ["OhnomiTools*"]
